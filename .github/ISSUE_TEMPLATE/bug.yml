# managed by kynda-labs/dev-process issues/sync.sh — edit there, not here
name: Bug
description: Something behaves wrongly. Include how to reproduce it.
type: "Bug"
body:
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: The wrong behavior, with the exact error text if there is one.
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: What should happen
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Commands or steps, from a fresh checkout if possible. Include the commit.
    validations: { required: true }
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Logs, CI run links, file and line references.

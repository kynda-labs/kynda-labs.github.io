# managed by kynda-labs/dev-process issues/sync.sh — edit there, not here
name: CI finding
description: A problem the CI pipeline exposed that needs a fix in this repo.
type: "CI finding"
body:
  - type: input
    id: run
    attributes:
      label: CI run or PR
      description: Link to the run or PR where it showed up.
    validations: { required: true }
  - type: textarea
    id: finding
    attributes:
      label: Finding
      description: What failed and why, with file and line references.
    validations: { required: true }
  - type: dropdown
    id: local
    attributes:
      label: Does it fail outside CI too?
      options: ["Yes — fails on the Mac too", "No — CI only", "Not checked"]
    validations: { required: true }
  - type: textarea
    id: fix
    attributes:
      label: Possible fix
      description: Optional. The owner decides.
